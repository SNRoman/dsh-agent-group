# The dsh-agent-group bundle: one insert over a profile that already
# provides the DSH core and the storage stack (dsh-web-app / dsh-headless mount
# the storage hub, backend, and domain form). This bundle mounts only the Host
# domain service and its Browser overlay; it must not re-declare storage, which
# would override the profile's persistence root. Rows are addressed by id.
- insert:
    - id: agent-workspace
      name: '@dsh-agent-group/host'

    - id: agent-workspace-web
      name: '@dsh-agent-group/web'
