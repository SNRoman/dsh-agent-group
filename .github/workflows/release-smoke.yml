name: Release smoke

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'compatibility.json'
      - 'packages/**/package.json'
      - 'packages/**/cordis.patch.yml'
      - 'packages/**/src/**'
      - 'scripts/release.mjs'
      - 'scripts/release-artifacts.mjs'
      - 'scripts/export-forward-v1.mjs'
      - 'scripts/release-smoke.mjs'
      - 'scripts/release-smoke-contract.mjs'
      - 'tests/e2e/workspace-browser.mjs'
      - 'tests/e2e/README.md'
      - 'tests/fixtures/browser/**'
      - 'tests/fixtures/v0.1.0/agent-workspace.json'
      - 'tests/release-contract.spec.ts'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/release-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packed-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin/dsh-agent-group

      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84 # 0.2.0-rc.2
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            deepseek-harness/pnpm-lock.yaml
            plugin/dsh-agent-group/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin/dsh-agent-group
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: plugin/dsh-agent-group
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify forward-export smoke inputs
        working-directory: plugin/dsh-agent-group
        run: >-
          test -f scripts/export-forward-v1.mjs &&
          test -f packages/host/src/forward-export.ts &&
          test -f tests/fixtures/v0.1.0/agent-workspace.json

      - name: Pack and run the assembled Browser smoke
        working-directory: plugin/dsh-agent-group
        run: pnpm test:e2e:browser -- --dsh "$GITHUB_WORKSPACE/deepseek-harness"

      - name: Upload release-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-release-smoke
          path: plugin/dsh-agent-group/.release-smoke/
          if-no-files-found: error
