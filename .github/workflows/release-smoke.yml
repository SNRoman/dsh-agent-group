name: Release smoke

on:
  pull_request:
    paths:
      - 'package.json'
      - 'packages/**/package.json'
      - 'packages/**/cordis.patch.yml'
      - 'packages/**/src/**'
      - 'scripts/release.mjs'
      - 'tests/release-contract.spec.ts'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/release-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packed-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin/dsh-agent-group

      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            deepseek-harness/pnpm-lock.yaml
            plugin/dsh-agent-group/pnpm-lock.yaml

      - name: Install and build Harness libraries
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm build:lib

      - name: Install plugin dependencies
        working-directory: plugin/dsh-agent-group
        run: pnpm install --frozen-lockfile

      - name: Pack publishable artifacts
        working-directory: plugin/dsh-agent-group
        run: |
          # release:pack executes pnpm pack in host -> web -> bundle order.
          pnpm release:pack

      - name: Locate and inspect packed artifacts
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$GITHUB_WORKSPACE/plugin/dsh-agent-group/release"
          HOST_TGZ="$(find "$PACK_DIR" -maxdepth 1 -name 'dsh-agent-group-host-*.tgz' -print -quit)"
          WEB_TGZ="$(find "$PACK_DIR" -maxdepth 1 -name 'dsh-agent-group-web-*.tgz' -print -quit)"
          BUNDLE_TGZ="$(find "$PACK_DIR" -maxdepth 1 -name 'dsh-agent-group-*.tgz' ! -name 'dsh-agent-group-host-*' ! -name 'dsh-agent-group-web-*' -print -quit)"

          test -n "$HOST_TGZ"
          test -n "$WEB_TGZ"
          test -n "$BUNDLE_TGZ"

          for tgz in "$HOST_TGZ" "$WEB_TGZ" "$BUNDLE_TGZ"; do
            manifest="$(tar -xOf "$tgz" package/package.json)"
            if grep -q 'workspace:' <<<"$manifest"; then
              echo "Packed manifest leaked a workspace: dependency: $tgz" >&2
              exit 1
            fi
            if grep -q 'link:.*deepseek-harness' <<<"$manifest"; then
              echo "Packed manifest leaked a development link: $tgz" >&2
              exit 1
            fi
          done

          echo "HOST_TGZ=$HOST_TGZ" >> "$GITHUB_ENV"
          echo "WEB_TGZ=$WEB_TGZ" >> "$GITHUB_ENV"
          echo "BUNDLE_TGZ=$BUNDLE_TGZ" >> "$GITHUB_ENV"

      - name: Stage bundle with local packed dependencies
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dsh-agent-group-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$BUNDLE_TGZ" -C "$STAGE"

          STAGE="$STAGE" HOST_TGZ="$HOST_TGZ" WEB_TGZ="$WEB_TGZ" node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const { join } = require('node:path')
          const path = join(process.env.STAGE, 'package', 'package.json')
          const manifest = JSON.parse(readFileSync(path, 'utf8'))
          manifest.dependencies['@dsh-agent-group/host'] = `file:${process.env.HOST_TGZ}`
          manifest.dependencies['@dsh-agent-group/web'] = `file:${process.env.WEB_TGZ}`
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE

          npm pack "$STAGE/package" --pack-destination "$STAGE" --json > "$STAGE/pack-result.json"
          STAGED_BUNDLE="$(STAGE="$STAGE" node <<'NODE'
          const { readFileSync } = require('node:fs')
          const { join } = require('node:path')
          const result = JSON.parse(readFileSync(join(process.env.STAGE, 'pack-result.json'), 'utf8'))
          process.stdout.write(join(process.env.STAGE, result[0].filename))
          NODE
          )"
          test -f "$STAGED_BUNDLE"
          echo "STAGED_BUNDLE=$STAGED_BUNDLE" >> "$GITHUB_ENV"

      - name: Install into a clean DSH profile
        shell: bash
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-agent-group-home"
          rm -rf "$DSH_HOME"
          mkdir -p "$DSH_HOME"

          cd "$GITHUB_WORKSPACE/deepseek-harness"
          pnpm dsh plugin --profile web add "$STAGED_BUNDLE"

          DSH_HOME="$DSH_HOME" node <<'NODE'
          const { readFileSync } = require('node:fs')
          const { join } = require('node:path')
          const manifest = JSON.parse(readFileSync(join(process.env.DSH_HOME, 'profiles', 'web', 'package.json'), 'utf8'))
          if (manifest.dependencies?.['dsh-agent-group'] === undefined) {
            throw new Error('clean profile did not record dsh-agent-group dependency')
          }
          if (!manifest.dsh?.profile?.bundles?.includes('dsh-agent-group')) {
            throw new Error('clean profile did not activate dsh-agent-group bundle')
          }
          NODE

          pnpm dsh --profile web --dump-config > "$RUNNER_TEMP/dsh-agent-group-config.yml"
          grep -q 'agent-workspace' "$RUNNER_TEMP/dsh-agent-group-config.yml"
          grep -q 'agent-workspace-web' "$RUNNER_TEMP/dsh-agent-group-config.yml"
