name: Finalize v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify tag
        shell: bash
        env:
          RELEASE_SHA: a659ee3827a4cd77188e24ad3a7d1ed20145813b
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git show-ref --verify --quiet refs/tags/v0.1.0; then
            test "$(git rev-list -n 1 v0.1.0)" = "$RELEASE_SHA"
            echo "v0.1.0 already points to the verified release source"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.1.0 "$RELEASE_SHA" -m "dsh-agent-group v0.1.0"
            git push origin refs/tags/v0.1.0
          fi
          test "$(git rev-list -n 1 v0.1.0)" = "$RELEASE_SHA"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: a659ee3827a4cd77188e24ad3a7d1ed20145813b
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "GitHub Release v0.1.0 already exists"
          else
            gh release create v0.1.0 \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "dsh-agent-group v0.1.0" \
              --notes-file - <<'EOF'
          First public release of dsh-agent-group, a persistent multi-agent workspace for DeepSeek Harness.

          Highlights:
          - Agent definitions and multiple agent instances
          - Group rooms and direct chat
          - @mentions and @all
          - Streaming replies with reasoning and tool-call rendering
          - Persistent workspace state
          - Human-authorized delegation and child agents
          - Browser Workspace UI

          Install:

              dsh plugin --profile web add dsh-agent-group

          Requires DeepSeek Harness 0.1.1-rc.2 release line.
          EOF
          fi

      - name: Verify release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: a659ee3827a4cd77188e24ad3a7d1ed20145813b
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 v0.1.0)" = "$RELEASE_SHA"
          gh release view v0.1.0 --json tagName,isDraft,isPrerelease,url \
            --jq 'select(.tagName == "v0.1.0" and .isDraft == false and .isPrerelease == false)'
