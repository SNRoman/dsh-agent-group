name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify compatibility declaration
        run: pnpm verify:compatibility

      - name: Verify localized client copy
        run: pnpm verify:client-copy

      - name: Build
        shell: bash
        run: set -o pipefail; pnpm build 2>&1 | tee build.log

      - name: Typecheck
        shell: bash
        run: set -o pipefail; pnpm typecheck 2>&1 | tee typecheck.log

      - name: Test
        shell: bash
        run: set -o pipefail; pnpm test 2>&1 | tee test.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            build.log
            typecheck.log
            test.log
          if-no-files-found: ignore

  source-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin/dsh-agent-group

      - name: Checkout verified DeepSeek Harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84 # 0.2.0-rc.2
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            deepseek-harness/pnpm-lock.yaml
            plugin/dsh-agent-group/pnpm-lock.yaml

      - name: Install Harness dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build Harness libraries
        working-directory: deepseek-harness
        run: pnpm build:lib

      - name: Verify compatibility declaration
        working-directory: plugin/dsh-agent-group
        run: pnpm verify:compatibility

      - name: Test verified Harness source compatibility
        working-directory: plugin/dsh-agent-group
        run: pnpm test:dsh-source -- --dsh "$GITHUB_WORKSPACE/deepseek-harness"

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin/dsh-agent-group

      - name: Checkout verified DeepSeek Harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84 # 0.2.0-rc.2
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: plugin/dsh-agent-group/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin/dsh-agent-group
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: plugin/dsh-agent-group
        run: pnpm exec playwright install --with-deps chromium

      - name: Run assembled Browser workflow
        working-directory: plugin/dsh-agent-group
        run: pnpm test:e2e:browser -- --dsh "$GITHUB_WORKSPACE/deepseek-harness"

      - name: Upload Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e
          path: plugin/dsh-agent-group/.release-smoke/
          if-no-files-found: error
