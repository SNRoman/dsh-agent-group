name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin/dsh-agent-group

      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            deepseek-harness/pnpm-lock.yaml
            plugin/dsh-agent-group/pnpm-lock.yaml

      - name: Install Harness dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build Harness host libraries
        working-directory: deepseek-harness
        run: pnpm build:lib:host

      - name: Install plugin dependencies
        working-directory: plugin/dsh-agent-group
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: plugin/dsh-agent-group
        run: pnpm build

      - name: Typecheck
        working-directory: plugin/dsh-agent-group
        run: pnpm typecheck

      - name: Test
        working-directory: plugin/dsh-agent-group
        run: pnpm test
