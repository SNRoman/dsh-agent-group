name: Registry smoke

on:
  workflow_dispatch:
    inputs:
      plugin-version:
        description: Exact published dsh-agent-group version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-smoke-${{ inputs.plugin-version }}
  cancel-in-progress: false

jobs:
  exact-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin smoke driver
        uses: actions/checkout@v4
        with:
          path: plugin/dsh-agent-group

      - name: Checkout verified DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e # 0.1.1-rc.2
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            deepseek-harness/pnpm-lock.yaml
            plugin/dsh-agent-group/pnpm-lock.yaml

      - name: Install smoke dependencies
        working-directory: plugin/dsh-agent-group
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: plugin/dsh-agent-group
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for all manifests and run exact-version smoke
        working-directory: plugin/dsh-agent-group
        run: >-
          pnpm smoke:registry --
          --version "${{ inputs.plugin-version }}"
          --dsh "$GITHUB_WORKSPACE/deepseek-harness"

      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-smoke-${{ inputs.plugin-version }}
          path: plugin/dsh-agent-group/.release-smoke/
          if-no-files-found: error
